worker_processes 1;
pid /run/token-monitor-public/nginx.pid;
# nginx error messages can contain the request query. Record status codes in
# the sanitized access log instead; only critical process errors go to journal.
error_log stderr crit;

events {
    worker_connections 512;
}

http {
    map_hash_bucket_size 512;
    include /etc/token-monitor-public/auth.conf;
    server_tokens off;
    default_type application/json;
    log_format public_safe '$time_iso8601 $remote_addr $request_method $uri '
                           '$status $body_bytes_sent $request_time';
    access_log /var/log/token-monitor-public/access.log public_safe;
    client_body_temp_path /run/token-monitor-public/body;
    proxy_temp_path /run/token-monitor-public/proxy;
    fastcgi_temp_path /run/token-monitor-public/fastcgi;
    uwsgi_temp_path /run/token-monitor-public/uwsgi;
    scgi_temp_path /run/token-monitor-public/scgi;
    client_max_body_size 1m;
    client_body_buffer_size 64k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 15s;
    reset_timedout_connection on;

    # Tailscale 1.104.1 overwrites X-Forwarded-For with the original client IP.
    # Trust only its local reverse-proxy connection, never an arbitrary peer.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    limit_req_zone $binary_remote_addr zone=public_client:1m rate=5r/s;
    limit_req_zone $server_name zone=public_total:1m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=public_connections:1m;
    limit_conn_zone $server_name zone=public_total_connections:1m;
    limit_req_status 429;
    limit_conn_status 429;

    server {
        listen 127.0.0.1:17422;
        server_name _;
        limit_req zone=public_client burst=40 nodelay;
        limit_req zone=public_total burst=100 nodelay;
        limit_conn public_connections 20;
        limit_conn public_total_connections 100;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy no-referrer always;
        # Keep the desktop/browser protocol's existing CORS contract.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization,content-type,x-token-monitor-secret,x-token-monitor-response,x-token-monitor-stream" always;
        proxy_hide_header Server;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_set_header Host 127.0.0.1:17322;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 15s;
        # SSE emits a heartbeat every 30s; this is an inactivity timeout.
        proxy_read_timeout 90s;
        proxy_buffering off;
        proxy_request_buffering on;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =503 @unavailable;
        error_page 404 =404 @not_found;

        # Desktop clients check this public build/health document before login.
        # It contains no device records, history, or shared secret.
        location = /api/health {
            limit_except GET { deny all; }
            proxy_pass http://127.0.0.1:17322;
        }

        location /api/ {
            # Preflights carry no secret. The Hub supplies its protocol CORS
            # headers; actual data requests still pass both authentication gates.
            set $public_request_auth_ok $public_auth_ok;
            if ($request_method = OPTIONS) {
                set $public_request_auth_ok 1;
            }
            # Authentication happens in the access phase, after rate limiting.
            # A rewrite-phase return here would skip limits on failed logins.
            auth_request /_public_auth;
            proxy_pass http://127.0.0.1:17322;
        }

        location = /_public_auth {
            internal;
            access_log off;
            if ($public_request_auth_ok = 0) { return 401; }
            return 204;
        }

        location / {
            # A content-phase rejection keeps rate limits effective for scans
            # of unknown paths, unlike a rewrite-phase `return 404`.
            root /etc/token-monitor-public/no-public-content;
            try_files /nonexistent =404;
        }

        location @not_found {
            return 404 '{"error":"not_found"}';
        }

        location @unavailable {
            return 503 '{"error":"service_unavailable"}';
        }
    }
}
