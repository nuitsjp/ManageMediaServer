name: smarthome

services:
  homeassistant:
    # 2026.10.4 の linux/amd64 manifest。更新は手動でバックアップ後に行う。
    image: ghcr.io/home-assistant/home-assistant:2026.10.4@sha256:21935614df6d9f24f680a1ef749f0570d2d6b7936c606c0a44253ae875865c04
    platform: linux/amd64
    container_name: homeassistant
    network_mode: host
    # 起動順を systemd で管理し、必ず FW 適用後に起動する。
    restart: "no"
    stop_grace_period: 60s
    environment:
      TZ: Asia/Tokyo
      SETUP_PORT: "8123"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - apparmor=manage-smarthome-homeassistant
    volumes:
      - /mnt/data/smarthome/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8123/', timeout=10).close()"
      interval: 60s
      timeout: 15s
      start_period: 180s
      retries: 3
